# Madire OS full regression on a GitHub-hosted runner (manual trigger only).
# Runs `make unit test iso` on ubuntu-24.04 with the same toolchain as the
# Codespace (scripts/install-deps.sh), under QEMU's software emulation (TCG;
# KVM is never enabled). No secrets; read-only access to the repository.
# Start it with: gh workflow run regression.yml --ref main -f ref=<commit>
name: regression

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to test (for example wip/0.12)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record the commit and the SHA-256 manifest of the files under test
        run: |
          git rev-parse HEAD | tee commit.txt
          find ./Makefile ./boot ./drivers ./iso ./kernel ./linker ./scripts ./tests ./user \
               -type f -print0 2>/dev/null | LC_ALL=C sort -z | xargs -0 sha256sum > manifest.sha256
          echo "files: $(wc -l < manifest.sha256)"

      - name: Install the toolchain (as the devcontainer does)
        run: bash scripts/install-deps.sh

      - name: Tool versions
        run: |
          { gcc --version | head -n 1; ld --version | head -n 1; nasm -v;
            grub-mkrescue --version | head -n 1; qemu-system-x86_64 --version | head -n 1;
            python3 --version; nproc; free -m | sed -n 2p; } | tee tools.txt

      - name: make unit test iso (TCG)
        run: |
          start=$(date +%s)
          set +e
          make unit test iso > regression.log 2>&1
          rc=$?
          set -e
          printf '\nMAKE EXIT %s\n' "$rc" >> regression.log
          echo "seconds: $(( $(date +%s) - start ))" | tee duration.txt
          echo "$rc" > make-exit.txt
          tail -n 3 regression.log

      - name: Checks (source unchanged, symbols, SSE, 2 MiB margin, kernel hash)
        if: always()
        run: |
          {
            find ./Makefile ./boot ./drivers ./iso ./kernel ./linker ./scripts ./tests ./user \
                 -type f ! -path './build/*' -print0 2>/dev/null | LC_ALL=C sort -z | xargs -0 sha256sum > final.sha256
            if cmp -s manifest.sha256 final.sha256; then echo FINAL_SNAPSHOT_HASH_MATCH=PASS; else echo FINAL_SNAPSHOT_HASH_MATCH=FAIL; fi
            grep -E 'ALL TESTS|FAILED|MAKE EXIT|Reproducible build:' regression.log || true
            echo "UNIT_SUITES_PASS=$(grep -c -- '-> PASS' regression.log || true)"
            echo "FAIL_LINES=$(grep -c '^FAIL' regression.log || true)"
            echo "UNDEFINED_SYMBOLS=$(nm -u build/madire.elf | wc -l)"
            echo "LIBGCC_LIBC_HELPERS=$(find build -name '*.o' -not -path 'build/unit/*' -not -path 'build/repro*' -print0 |
                 xargs -0 -n1 nm -u | grep -cE '__(udiv|div|mod|umod|mul|popcount|stack_chk)|^ *U (memset|memcpy|memmove|memcmp|strlen)$' || true)"
            echo "SSE_X87_REGISTER_USES=$(objdump -d build/madire.elf | grep -cE '%(x|y|z)mm[0-9]|%st(\(|$)|%mm[0-9]' || true)"
            end=$(nm -n build/madire.elf | awk '$3 == "__kernel_end" {print $1; exit}')
            echo "KERNEL_END_VIRTUAL=0x$end"
            echo "TWO_MIB_MARGIN_BYTES=$(( 0x200000 - (0x$end - 0xffffffff80000000) ))"
            sha256sum build/madire.elf build/madire.kernel build/madire-os.iso
          } 2>&1 | tee checks.txt

      - name: Upload the log, the per-boot serial logs and the stall captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            commit.txt
            manifest.sha256
            final.sha256
            tools.txt
            duration.txt
            make-exit.txt
            checks.txt
            regression.log
            build/serial-*.log
            build/*.keys.txt
            build/*.irq1.txt
            build/stall/

      - name: Fail the job if the regression failed
        if: always()
        run: test "$(cat make-exit.txt 2>/dev/null)" = 0
