set timeout=3
set default=0

menuentry "Madire OS v0.2" {
    multiboot /boot/madire.kernel
    boot
}

submenu "Diagnostics" {
    menuentry "Crash test: divide by zero" {
        multiboot /boot/madire.kernel test=divzero
        boot
    }
    menuentry "Crash test: invalid opcode" {
        multiboot /boot/madire.kernel test=ud
        boot
    }
    menuentry "Crash test: general protection fault" {
        multiboot /boot/madire.kernel test=gpf
        boot
    }
}
