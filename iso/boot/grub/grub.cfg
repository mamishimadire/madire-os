set timeout=3
set default=0

menuentry "Madire OS v@MADIRE_OS_VERSION@" {
    multiboot /boot/madire.kernel
    module /boot/prog/hello.elf hello
    module /boot/prog/spin.elf spin
    module /boot/prog/exitcode.elf exitcode
    module /boot/prog/nullptr.elf nullptr
    module /boot/prog/sleep.elf sleep
    module /boot/prog/getpid.elf getpid
    module /boot/prog/lines.elf lines
    boot
}

submenu "Diagnostics" {
    menuentry "Crash test: divide by zero" {
        multiboot /boot/madire.kernel test=divzero
        boot
    }
    menuentry "Crash test: invalid opcode" {
        multiboot /boot/madire.kernel test=ud
        boot
    }
    menuentry "Crash test: general protection fault" {
        multiboot /boot/madire.kernel test=gpf
        boot
    }
    menuentry "Page-fault test: read from NULL" {
        multiboot /boot/madire.kernel test=pfnull
        boot
    }
    menuentry "Page-fault test: read from unmapped address" {
        multiboot /boot/madire.kernel test=pfunmapped
        boot
    }
    menuentry "Page-fault test: write to read-only kernel code" {
        multiboot /boot/madire.kernel test=pfreadonly
        boot
    }
    menuentry "Page-fault test: execute from no-execute data (NX)" {
        multiboot /boot/madire.kernel test=pfnx
        boot
    }
    menuentry "Page-fault test: read the kernel's old low address" {
        multiboot /boot/madire.kernel test=pflow
        boot
    }
    menuentry "Crash test: kernel stack overflow" {
        multiboot /boot/madire.kernel test=stackoverflow
        boot
    }
    menuentry "Memory test: allocate every page" {
        multiboot /boot/madire.kernel test=memexhaust
        boot
    }
    menuentry "Memory test: double free" {
        multiboot /boot/madire.kernel test=doublefree
        boot
    }
    menuentry "Memory test: free a kernel page" {
        multiboot /boot/madire.kernel test=freereserved
        boot
    }
    menuentry "Timer test: measure against RTC" {
        multiboot /boot/madire.kernel test=timer
        boot
    }
    menuentry "Keyboard test: show key codes" {
        multiboot /boot/madire.kernel test=keyboard
        boot
    }
    menuentry "Thread test: preemption" {
        multiboot /boot/madire.kernel test=preempt
        boot
    }
    menuentry "Crash test: kernel thread stack overflow" {
        multiboot /boot/madire.kernel test=threadoverflow
        boot
    }
    menuentry "User-mode test: a program in ring 3, preempted" {
        multiboot /boot/madire.kernel test=userspin
        boot
    }
    menuentry "User-mode test: kill processes" {
        multiboot /boot/madire.kernel test=userkill
        boot
    }
    menuentry "User-mode test: contained program faults" {
        multiboot /boot/madire.kernel test=userfault
        boot
    }
    menuentry "User-mode test: privileged instructions" {
        multiboot /boot/madire.kernel test=userpriv
        boot
    }
    menuentry "User-mode test: kernel memory out of reach" {
        multiboot /boot/madire.kernel test=userkmem
        boot
    }
    menuentry "User-mode test: system calls" {
        multiboot /boot/madire.kernel test=usersys
        boot
    }
    menuentry "User-mode test: write, sleep and bad pointers" {
        multiboot /boot/madire.kernel test=userio
        boot
    }
    menuentry "User-mode test: preemption of user processes" {
        multiboot /boot/madire.kernel test=userpreempt
        boot
    }
    menuentry "User-mode test: 1000 processes" {
        multiboot /boot/madire.kernel test=userchurn
        boot
    }
    menuentry "Crash test: the kernel executes a user page (SMEP)" {
        multiboot /boot/madire.kernel test=smep
        boot
    }
    menuentry "Crash test: the kernel reads a user page (SMAP)" {
        multiboot /boot/madire.kernel test=smap
        boot
    }
}
