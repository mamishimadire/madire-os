# Madire OS boot menu for Limine (0.13). The default entry loads the 7
# program modules; each module's module_string is its name (Limine passes
# only this string to the kernel, not the path). The Diagnostics directory
# holds the 27 test boots, in the order of the former GRUB Diagnostics
# submenu (positions 0-26).
#
# 1.1: the menu is hidden (quiet): with no key the first entry boots after
# 2 s and nothing of Limine is drawn; a key in those 2 s shows the menu at
# 1024x768 on the wallpaper (scripts/make-wallpaper.py, which shows the
# version read from kernel/kernel.h), inside the wallpaper's panel
# (term_margin 240: 60 x 18 cells, a 10-row window). The first entry is the
# default one (no default_entry).

timeout: 2
quiet: yes
mouse: no
interface_resolution: 1024x768
interface_branding:
interface_help_hidden: yes
editor_enabled: no
terse: yes
wallpaper: boot():/boot/limine/wallpaper.png
wallpaper_style: centered
backdrop: 0B1220
term_foreground: E6EDF3
term_background: FF000000
term_margin: 240
term_margin_gradient: 0

/Boot Madire OS
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    module_path: boot():/boot/prog/hello.elf
    module_string: hello
    module_path: boot():/boot/prog/spin.elf
    module_string: spin
    module_path: boot():/boot/prog/exitcode.elf
    module_string: exitcode
    module_path: boot():/boot/prog/nullptr.elf
    module_string: nullptr
    module_path: boot():/boot/prog/sleep.elf
    module_string: sleep
    module_path: boot():/boot/prog/getpid.elf
    module_string: getpid
    module_path: boot():/boot/prog/lines.elf
    module_string: lines

/Diagnostics
//Crash test: divide by zero
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=divzero
//Crash test: invalid opcode
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=ud
//Crash test: general protection fault
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=gpf
//Page-fault test: read from NULL
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=pfnull
//Page-fault test: read from unmapped address
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=pfunmapped
//Page-fault test: write to read-only kernel code
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=pfreadonly
//Page-fault test: execute from no-execute data (NX)
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=pfnx
//Page-fault test: read the kernel's old low address
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=pflow
//Crash test: kernel stack overflow
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=stackoverflow
//Memory test: allocate every page
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=memexhaust
//Memory test: double free
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=doublefree
//Memory test: free a kernel page
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=freereserved
//Timer test: measure against RTC
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=timer
//Keyboard test: show key codes
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=keyboard
//Thread test: preemption
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=preempt
//Crash test: kernel thread stack overflow
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=threadoverflow
//User-mode test: a program in ring 3, preempted
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=userspin
//User-mode test: kill processes
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=userkill
//User-mode test: contained program faults
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=userfault
//User-mode test: privileged instructions
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=userpriv
//User-mode test: kernel memory out of reach
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=userkmem
//User-mode test: system calls
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=usersys
//User-mode test: write, sleep and bad pointers
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=userio
//User-mode test: preemption of user processes
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=userpreempt
//User-mode test: 1000 processes
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=userchurn
//Crash test: the kernel executes a user page (SMEP)
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=smep
//Crash test: the kernel reads a user page (SMAP)
    protocol: multiboot1
    path: boot():/boot/madire.kernel
    cmdline: test=smap
