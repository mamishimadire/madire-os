# Madire OS test images (1.4 stage 2): the pinned mke2fs configuration.
# tests/disk-lib.sh runs mke2fs with MKE2FS_CONFIG pointing here, so the
# runner's /etc/mke2fs.conf (or a newer release's built-in defaults) never
# changes an image. Its options are also given in full on the command line
# (disk_mkfs); this file fixes what the command line leaves unsaid. The
# keys are those of mke2fs.conf(5).
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = false
	blocksize = 1024
	inode_size = 256
	inode_ratio = 4096
	reserved_ratio = 0
	lazy_itable_init = false
	hash_alg = half_md4

# Every usage type mke2fs may choose by size maps to the same empty stanza,
# so no size-based default applies; "madire" is the type disk_mkfs names.
# 1.4 stage 9: the madire stanza holds one real setting (the same inode
# ratio as [defaults]), so mke2fs finds the type defined and stops warning
# "the fs_type madire is not defined"; [defaults] has 256-byte inodes (risk
# 42). disk_mkfs gives -I and -N on every command line, so the S2, S6 and
# S8 images keep 128-byte inodes and every checked parameter. 1.4 stage 10
# (corrected): this change did not alter their bytes. An image is identical
# within one run but varies between runs (the stage 2 image ext2-1k-128 has
# had a new SHA-256 in every run since stage 2), because mke2fs -d copies
# the source files' change times (ctime), which touch cannot set; run
# 42280501419 made it with stage 8's and this configuration in one run:
# 0 bytes differ (part static's stage 9 section, report only).
[fs_types]
	ext2 = {
	}
	madire = {
		inode_ratio = 4096
	}
	floppy = {
	}
	small = {
	}
	default = {
	}
