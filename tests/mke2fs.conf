# Madire OS test images (1.4 stage 2): the pinned mke2fs configuration.
# tests/disk-lib.sh runs mke2fs with MKE2FS_CONFIG pointing here, so the
# runner's /etc/mke2fs.conf (or a newer release's built-in defaults) never
# changes an image. Its options are also given in full on the command line
# (disk_mkfs); this file fixes what the command line leaves unsaid. The
# keys are those of mke2fs.conf(5).
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = false
	blocksize = 1024
	inode_size = 128
	inode_ratio = 4096
	reserved_ratio = 0
	lazy_itable_init = false
	hash_alg = half_md4

# Every usage type mke2fs may choose by size maps to the same empty stanza,
# so no size-based default applies; "madire" is the type disk_mkfs names.
[fs_types]
	ext2 = {
	}
	madire = {
	}
	floppy = {
	}
	small = {
	}
	default = {
	}
